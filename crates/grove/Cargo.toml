[package]
name = "grove"
description = "The grove command suite: git verbs (status/add/commit/pull/push) + shell-alias setup (grove init)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
grove-core = { path = "../grove-core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
