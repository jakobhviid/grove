[package]
name = "grove"
description = "The grove command suite: git verbs (status/add/commit/pull/push) + shell-alias setup (grove init)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
grove-core = { path = "../grove-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
