[package]
name = "grove-core"
description = "Shared logic for the grove tools: git helpers, passthrough exec, multi-repo overview/sync, tree."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
rayon = "1"
indicatif = "0.17"
supports-hyperlinks = "3.2.0"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
