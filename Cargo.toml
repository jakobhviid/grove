[package]
name = "grove"
version = "0.1.0"
edition = "2021"
description = "Portable git shortcuts (gs/ga/gc/…) plus a multi-repo overview & sync, as one binary for any shell."
license = "MIT"

[[bin]]
name = "grove"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
